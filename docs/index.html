<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="听音辨名 · 绝对音感训练小工具（纯浏览器运行，无需后端）">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Crect x='9' y='12' width='46' height='40' rx='5' fill='%23ffffff'/%3E%3Cpath d='M20 12v40M32 12v40M44 12v40' stroke='%23d1d5db' stroke-width='2'/%3E%3Crect x='14.5' y='12' width='9' height='23' rx='2' fill='%2323272f'/%3E%3Crect x='38.5' y='12' width='9' height='23' rx='2' fill='%2323272f'/%3E%3C/svg%3E">
<title>音准练习 · 听音辨名</title>
<style>
  :root{
    --blue:#2563eb; --blue2:#3b82f6; --blue-deep:#1d4ed8;
    --green-deep:#15803d; --red-deep:#b91c1c;
    --gray:#6b7280; --dark:#374151; --muted:#9ca3af; --sub:#6b7280; --text:#111827;
    --bg1:#eef2f7; --bg2:#dfe7f1;
    --card:#ffffff; --line:#e5e7eb;
    --note-bg:#f3f4f6;
    --key-white:#ffffff; --key-line:#e2e5ea; --key-black:#23272f; --key-black-text:#f9fafb;
    --shadow:0 12px 32px -14px rgba(15,23,42,.2);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --green-deep:#4ade80; --red-deep:#f87171;
      --gray:#94a3b8; --dark:#cbd5e1; --muted:#64748b; --sub:#94a3b8; --text:#e5eaf3;
      --bg1:#0b1220; --bg2:#101a2d;
      --card:#161f33; --line:#2a3550;
      --note-bg:#1c2740;
      --key-white:#1c2740; --key-line:#2c3852; --key-black:#0a0f1c; --key-black-text:#cbd5e1;
      --shadow:0 12px 32px -14px rgba(0,0,0,.65);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:26px 14px;min-height:100vh;min-height:100dvh;
       font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       -webkit-font-smoothing:antialiased;color:var(--text);display:flex;justify-content:center;
       background:
         radial-gradient(1100px 560px at 18% -8%, rgba(59,130,246,.13), transparent 60%),
         radial-gradient(880px 460px at 100% 0%, rgba(34,197,94,.10), transparent 55%),
         linear-gradient(160deg, var(--bg1), var(--bg2));}
  .app{width:100%;max-width:600px;background:var(--card);border:1px solid var(--line);
       border-radius:18px;box-shadow:var(--shadow);padding:22px 24px 16px}
  h1{margin:0;font-size:26px;text-align:center;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px}
  .logo{width:27px;height:27px;flex:none}
  .sub{text-align:center;color:var(--sub);font-size:13px;margin:4px 0 12px}
  .header-rule{height:3px;width:58px;margin:0 auto 14px;border-radius:2px;
       background:linear-gradient(90deg, var(--blue), #22c55e)}

  /* 页面切换标签: 日常练习 / 错题练习 */
  .tabs{display:flex;gap:8px;margin:0 0 12px}
  .tab{flex:1;padding:9px 10px;font-size:14.5px;font-weight:600;border-radius:11px}
  .tab:hover:not(.active){background:var(--note-bg)}
  .tab.active{background:linear-gradient(135deg, var(--blue2), var(--blue));border-color:transparent;color:#fff;
       box-shadow:0 6px 14px -8px rgba(37,99,235,.5)}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;
       background:rgba(239,68,68,.15);color:var(--red-deep);font-size:12px;font-weight:700}
  .tab.active .badge{background:rgba(255,255,255,.25);color:#fff}

  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:8px 0}
  .row label{font-size:13.5px;color:var(--sub)}
  select{appearance:none;-webkit-appearance:none;padding:6px 30px 6px 10px;
       border:1px solid var(--line);border-radius:10px;background-color:var(--card);color:var(--text);
       font-size:14px;cursor:pointer;
       background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23888d97'%20stroke-width='2.5'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='m6%209%206%206%206-6'/%3E%3C/svg%3E");
       background-repeat:no-repeat;background-position:right 9px center;background-size:13px;
       transition:border-color .15s}
  select:hover{border-color:var(--muted)}
  select:focus-visible{outline:2px solid var(--blue2);outline-offset:1px}
  .check{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13.5px;color:var(--sub);cursor:pointer}
  .check input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;
       background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
  .check input::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
       background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .check input:checked{background:var(--blue)}
  .check input:checked::before{transform:translateX(16px)}

  button{border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;
       padding:9px 13px;background:var(--card);color:var(--text);
       display:inline-flex;align-items:center;justify-content:center;gap:7px;
       transition:transform .12s ease, background-color .15s ease, box-shadow .15s ease, filter .15s ease}
  .ic{width:15px;height:15px;flex:none}
  .primary .ic{width:17px;height:17px}
  .playbtn .ic{display:none}
  .playbtn:not(.replay-mode) .ic-play{display:block}
  .playbtn.replay-mode .ic-replay{display:block}
  button:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
  button:disabled{opacity:.45;cursor:default}
  .row button:not(.primary):not(:disabled):hover{background:var(--note-bg);transform:translateY(-1px)}
  .primary{flex:1;border-color:transparent;color:#fff;font-size:16px;font-weight:700;padding:11px 16px;
       background:linear-gradient(135deg, var(--blue2), var(--blue));
       box-shadow:0 8px 18px -8px rgba(37,99,235,.55)}
  .primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .primary:active{transform:translateY(0);background:linear-gradient(135deg, var(--blue), var(--blue-deep))}

  /* 错题一览 */
  .mistake-list{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:var(--note-bg);
       color:var(--sub);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mistake-list .tag{padding:1px 8px;border-radius:999px;background:rgba(239,68,68,.13);
       color:var(--red-deep);font-weight:600;font-size:12px}

  /* 音名按钮做成琴键: 带升降号的音是黑键 */
  .notes{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:12px 0}
  .notes button{font-size:15px;font-weight:700;padding:12px 0;border-color:var(--key-line);
       background:var(--key-white);box-shadow:0 2px 6px -2px rgba(15,23,42,.14)}
  .notes button[data-name$="#"], .notes button[data-name$="b"]{
       background:var(--key-black);color:var(--key-black-text);border-color:var(--key-black)}
  .notes button:hover:not(:disabled):not(.ok):not(.bad){
       transform:translateY(-2px);box-shadow:0 7px 14px -6px rgba(15,23,42,.3)}
  .notes button.ok{background:linear-gradient(160deg, #34d399, #15803d);border-color:transparent;
       color:#fff;animation:pop .28s ease-out}
  .notes button.bad{background:linear-gradient(160deg, #f87171, #b91c1c);border-color:transparent;
       color:#fff;animation:shake .35s ease-out}
  @keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(4px)}80%{transform:translateX(-2px)}}

  .feedback{min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;
       font-size:15px;line-height:1.55;white-space:pre-line;margin:10px 0 4px;padding:10px 14px;
       border-radius:12px;background:var(--note-bg);color:var(--sub)}
  .feedback[data-tone="good"]{color:var(--green-deep)}
  .feedback[data-tone="bad"]{color:var(--red-deep)}
  .feedback[data-tone="info"]{color:var(--dark)}
  .stats{color:var(--sub);font-size:13px;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0}

  .bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;font-size:12px}
  .chips span{padding:2px 9px;border-radius:999px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .chips span::after{content:"";width:9px;height:5px;flex:none;border-left:2.5px solid currentColor;
       border-bottom:2.5px solid currentColor;transform:rotate(-45deg)}
  .chips .bad::after{width:9px;height:9px;border:none;transform:rotate(45deg);
       background:
         linear-gradient(currentColor,currentColor) center/100% 2.5px no-repeat,
         linear-gradient(currentColor,currentColor) center/2.5px 100% no-repeat}
  .chips .ok{color:var(--green-deep);background:rgba(34,197,94,.13)}
  .chips .bad{color:var(--red-deep);background:rgba(239,68,68,.13)}
  .progress{color:var(--sub);font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .progress:not(:empty)::before{content:"";width:11px;height:11px;border-radius:50%;flex:none;
       border:2px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin:12px 0 2px;padding-top:10px;
       border-top:1px dashed var(--line)}

  @media (max-width:480px){
    .app{padding:16px 14px;border-radius:14px}
    h1{font-size:21px}
    .notes{grid-template-columns:repeat(4,1fr)}
    .primary{flex-basis:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <h1><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3.5" width="20" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.7 3.5v17M15.3 3.5v17" stroke="currentColor" stroke-width="1.3"/><rect x="5.9" y="3.5" width="3.1" height="8.5" rx="1.2" fill="currentColor"/><rect x="13" y="3.5" width="3.1" height="8.5" rx="1.2" fill="currentColor"/></svg>音准练习</h1>
  <div class="sub">听音辨名 · 绝对音感训练</div>
  <div class="header-rule"></div>

  <nav class="tabs">
    <button class="tab active" data-view="practice" type="button">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3.5" width="20" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.7 3.5v17M15.3 3.5v17" stroke="currentColor" stroke-width="1.3"/><rect x="5.9" y="3.5" width="3.1" height="8.5" rx="1.2" fill="currentColor"/><rect x="13" y="3.5" width="3.1" height="8.5" rx="1.2" fill="currentColor"/></svg>日常练习
    </button>
    <button class="tab" data-view="mistakes" type="button">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>错题练习 <span class="badge" id="mistakeBadge" hidden>0</span>
    </button>
  </nav>

  <div class="row">
    <label>调性</label><select id="scaleBox"></select>
    <label>八度</label><select id="octaveBox"></select>
    <label>题数</label><select id="sizeBox"></select>
    <span class="check"><input type="checkbox" id="autoNext" checked><label for="autoNext">自动下一题</label></span>
  </div>

  <section id="p-view">
    <div class="row">
      <button class="primary playbtn" id="p-play">
        <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20" fill="currentColor"/></svg>
        <svg class="ic ic-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="label">开始练习</span>
      </button>
      <button id="p-prev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4" fill="currentColor"/><line x1="5" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>上一题</button>
      <button id="p-next"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>下一题</button>
      <button id="p-reveal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>看答案</button>
    </div>
    <div class="notes" id="p-notes"></div>
    <div class="feedback" id="p-feedback">选好调性、八度和题数，点「开始练习」</div>
  </section>

  <section id="m-view" hidden>
    <div class="mistake-list">错题集（隐去音名）：<span id="mistakeChips">（空）</span></div>
    <div class="row">
      <button class="primary playbtn" id="m-play">
        <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20" fill="currentColor"/></svg>
        <svg class="ic ic-replay" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="label">开始错题练习</span>
      </button>
      <button id="m-prev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="19 20 9 12 19 4" fill="currentColor"/><line x1="5" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>上一题</button>
      <button id="m-next"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 4 15 12 5 20" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>下一题</button>
      <button id="m-reveal"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>看答案</button>
    </div>
    <div class="notes" id="m-notes"></div>
    <div class="feedback" id="m-feedback">错题集是空的；在「日常练习」里答错、跳过或看答案的音会自动收进来</div>
  </section>

  <div class="stats" id="stats"></div>
  <div class="bottom">
    <div class="chips" id="chips"></div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="hint">空格 = 下一题 · 点击音名直接作答 · 答对答错都会自动进入下一题</div>
</div>
<script>
"use strict";
// 乐理数据(须与桌面版 src/tone_practice.py 的 SCALES 等保持一致, 自检脚本会核对)
const SCALES = {
  "C大调": ["C", "D", "E", "F", "G", "A", "B"],
  "G大调": ["G", "A", "B", "C", "D", "E", "F#"],
  "D大调": ["D", "E", "F#", "G", "A", "B", "C#"],
  "A大调": ["A", "B", "C#", "D", "E", "F#", "G#"],
  "E大调": ["E", "F#", "G#", "A", "B", "C#", "D#"],
  "B大调": ["B", "C#", "D#", "E", "F#", "G#", "A#"],
  "F大调": ["F", "G", "A", "Bb", "C", "D", "E"],
  "降B大调": ["Bb", "C", "D", "Eb", "F", "G", "A"],
  "降E大调": ["Eb", "F", "G", "Ab", "Bb", "C", "D"],
  "降A大调": ["Ab", "Bb", "C", "Db", "Eb", "F", "G"],
  "降D大调": ["Db", "Eb", "F", "Gb", "Ab", "Bb", "C"],
  "a小调(和声)": ["A", "B", "C", "D", "E", "F", "G#"],
  "e小调(和声)": ["E", "F#", "G", "A", "B", "C", "D#"],
  "b小调(和声)": ["B", "C#", "D", "E", "F#", "G", "A#"],
  "d小调(和声)": ["D", "E", "F", "G", "A", "Bb", "C#"],
  "g小调(和声)": ["G", "A", "Bb", "C", "D", "Eb", "F#"],
  "c小调(和声)": ["C", "D", "Eb", "F", "G", "Ab", "B"],
  "半音阶": ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
};
const OCTAVE_CHOICES = ["随机", "1", "2", "3", "4", "5", "6"];
const SESSION_CHOICES = ["5", "10", "20", "50"];

const PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
const SOLFEGE = {C:"do", D:"re", E:"mi", F:"fa", G:"sol", A:"la", B:"si"};
const GREEN = "#15803d", RED = "#b91c1c", GRAY = "#6b7280", DARK = "#374151";

const $ = id => document.getElementById(id);
const settings = { scale: $("scaleBox"), octave: $("octaveBox"), size: $("sizeBox"), autoNext: $("autoNext") };

// ---- 全局共享: 统计 + 错题集(localStorage, 与桌面版相互独立) ----
const shared = {
  attempts: 0, correct: 0, streak: 0, bestStreak: 0, history: [],
  mistakes: loadMistakes(),
};

function loadMistakes(){
  // 兼容旧版只有 name/count 的数据
  try {
    const raw = JSON.parse(localStorage.getItem("mistakes") || "{}");
    const out = {};
    for (const [pc, item] of Object.entries(raw)){
      out[pc] = {name: item.name, count: item.count || 0, tries: item.tries || 0, hits: item.hits || 0};
    }
    return out;
  } catch { return {}; }
}
function saveMistakes(){ localStorage.setItem("mistakes", JSON.stringify(shared.mistakes)); }

// ---- 乐理(音名都来自 SCALES 或错题集, 只需算音高) ----
function pcOf(name){
  const sign = name.includes("#") ? 1 : -1;
  return (PC[name[0]] + sign * (name.length - 1) + 12) % 12;
}
function midiOf(name, octave){ return (octave + 1) * 12 + pcOf(name); }
function display(name){ return name.replace(/#/g, "♯").replace(/b/g, "♭"); }
function solfege(name){ return SOLFEGE[name[0]] + display(name.slice(1)); }
function selectedOctave(){
  const value = settings.octave.value;
  return value === "随机" ? 1 + Math.floor(Math.random() * 6) : Number(value);
}

// ---- 内置钢琴音源: 桌面版加法合成的前端移植(Web Audio, 不需要任何音频文件/后端) ----
const RATE = 44100, PARTIALS = 8;
const INHARMONICITY = 0.0002, ATTACK_SEC = 0.003, FADE_SEC = 0.08, PEAK = 0.75;

function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

// 音越高越短促: 返回 (采样时长, 基音衰减时间常数) —— 对应桌面版 _note_shape
function noteShape(freq){
  const duration = Math.min(3.2, Math.max(1.4, 2.8 * Math.pow(261.626 / freq, 0.55)));
  const tau = Math.min(1.8, Math.max(0.4, 1.1 * Math.pow(220 / freq, 0.45)));
  return [duration, tau];
}

// 第 k 个泛音的 (频率, 幅度, 衰减常数); 频率过高返回 null —— 对应桌面版 _partial_params
function partialParams(k, freq, tau){
  const f = k * freq * Math.sqrt(1 + INHARMONICITY * k * k);
  if (f >= RATE * 0.45) return null;
  const amp = Math.pow(k, -1.3) * Math.exp(-0.15 * (k - 1));
  const tauK = tau / (0.7 + 0.3 * k);
  return [f, amp, tauK];
}

// 加法合成一个音: 泛音 + 不谐和 + 指数衰减 + 起音/淡出包络 + 归一化 —— 对应桌面版 _synth_pure
function synthNote(midi){
  const freq = midiToFreq(midi);
  const [duration, tau] = noteShape(freq);
  const n = Math.floor(duration * RATE);
  const sig = new Float32Array(n);
  for (let k = 1; k <= PARTIALS; k++){
    const p = partialParams(k, freq, tau);
    if (!p) break;
    const [f, amp, tauK] = p;
    const omega = 2 * Math.PI * f / RATE;
    const decay = Math.exp(-1 / (RATE * tauK));
    let env = amp, phase = 0;
    for (let i = 0; i < n; i++){
      phase += omega;
      sig[i] += env * Math.sin(phase);
      env *= decay;
    }
  }
  const a = 1 / (ATTACK_SEC * RATE);
  const fadeFrom = n - Math.floor(FADE_SEC * RATE);
  const fadeLen = n - fadeFrom;
  let peak = 1e-9;
  for (let i = 0; i < n; i++){
    let g = 1 - Math.exp(-a * i);
    if (i >= fadeFrom) g *= (n - i) / fadeLen;
    sig[i] *= g;
    const v = Math.abs(sig[i]);
    if (v > peak) peak = v;
  }
  const scale = PEAK / peak;
  for (let i = 0; i < n; i++) sig[i] *= scale;
  return sig;
}

const samples = new Map();  // midi → Float32Array(页面加载时后台合成, 纯计算, 不需手势)
const buffers = new Map();  // midi → AudioBuffer(首次播放时才建, AudioContext 需用户手势解锁)
let audioCtx = null, current = null;

function ensureCtx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function preloadSample(midi){
  if (!samples.has(midi)) samples.set(midi, synthNote(midi));
  return samples.get(midi);
}

function playNote(midi){
  try {
    const ctx = ensureCtx();
    if (!buffers.has(midi)){
      const data = preloadSample(midi);
      const buf = ctx.createBuffer(1, data.length, RATE);
      buf.copyToChannel(data, 0);
      buffers.set(midi, buf);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffers.get(midi);
    src.connect(ctx.destination);
    if (current){ try { current.stop(); } catch {} }
    current = src;
    src.start();
  } catch (err){
    setFeedback(active, `播放失败：${err.message}`, RED);
  }
}

async function preload(){  // 后台合成全部音源(让出主线程, 不卡界面), 进度显示在右下角
  const midis = [];
  for (let octave = 1; octave <= 6; octave++)
    for (let pc = 0; pc < 12; pc++) midis.push((octave + 1) * 12 + pc);
  for (let i = 0; i < midis.length; i++){
    preloadSample(midis[i]);
    $("progress").textContent = `音源准备中 ${i + 1}/${midis.length}`;
    if (i % 3 === 2) await new Promise(resolve => setTimeout(resolve, 0));
  }
  $("progress").textContent = "";
}

// ---- 两个练习页面: 各自独立的一组题, 随时切换, 统计与错题集共享 ----
function makeView(prefix, pool){
  return {
    pool,  // () => 出题音名数组
    questions: [], results: [], qIndex: 0, sessionActive: false, autoTimer: null,
    el: {
      root: $(`${prefix}-view`), play: $(`${prefix}-play`), prev: $(`${prefix}-prev`),
      next: $(`${prefix}-next`), reveal: $(`${prefix}-reveal`),
      notes: $(`${prefix}-notes`), feedback: $(`${prefix}-feedback`),
    },
  };
}
const views = {
  practice: makeView("p", () => SCALES[settings.scale.value]),
  // 错题练习只考当前调性音阶里错过的音, 选项则与日常练习一致(整个音阶)
  mistakes: makeView("m", () => SCALES[settings.scale.value]
    .filter(name => pcOf(name) in shared.mistakes)),
};
let active = views.practice;

function expected(view){ return view.questions[view.qIndex]; }
function shownNote(view){
  const q = expected(view);
  return display(q.name) + (Math.floor(q.midi / 12) - 1);
}
function cancelAutoNext(view){
  if (view.autoTimer){ clearTimeout(view.autoTimer); view.autoTimer = null; }
}

function startSession(view){
  cancelAutoNext(view);
  const names = view.pool();
  if (!names.length){
    setFeedback(view, !Object.keys(shared.mistakes).length
      ? "错题集是空的；在「日常练习」里答错、跳过或看答案的音会自动收进来"
      : `当前调性（${settings.scale.value}）的音阶里没有错题；可切换调性，或先做日常练习`, GRAY);
    return;
  }
  const count = Number(settings.size.value);
  const questions = [];
  let previous = null;
  for (let i = 0; i < count; i++){
    const pool = names.filter(n => n !== previous);
    const pick = pool.length ? pool : names;
    previous = pick[Math.floor(Math.random() * pick.length)];
    questions.push({name: previous, midi: midiOf(previous, selectedOctave())});
  }
  view.questions = questions;
  view.results = Array(count).fill(null);
  view.qIndex = 0;
  view.sessionActive = true;
  renderNoteButtons(view);
  enterQuestion(view, 0);
}

function enterQuestion(view, index, silent = false){
  view.qIndex = index;
  const {midi} = expected(view);
  for (const btn of view.el.notes.children) btn.classList.remove("ok", "bad");
  setPlayButton(view, "重听", true, () => replay(view));
  const recorded = view.results[index];
  if (recorded === null){
    setFeedback(view, `仔细听……第 ${index + 1}/${view.questions.length} 题，这是什么音？`, DARK);
  } else {
    applyResultColors(view, recorded.ok, recorded.clicked);
    setFeedback(view, recorded.message, recorded.ok ? GREEN : RED);
  }
  if (!silent) playNote(midi);
  renderStats();
}

function renderCurrent(view){  // 切回页面时刷新显示, 不发声
  if (view.sessionActive) enterQuestion(view, view.qIndex, true);
  else renderIdle(view);
}

function renderIdle(view){
  setPlayButton(view, view === views.practice ? "开始练习" : "开始错题练习", false,
    () => startSession(view));
  if (view === views.practice){
    setFeedback(view, "选好调性、八度和题数，点「开始练习」", GRAY);
  } else if (!Object.keys(shared.mistakes).length){
    setFeedback(view, "错题集是空的；在「日常练习」里答错、跳过或看答案的音会自动收进来", GRAY);
  } else if (!views.mistakes.pool().length){
    setFeedback(view, `当前调性（${settings.scale.value}）的音阶里没有错题；可切换调性，或先做日常练习`, GRAY);
  } else {
    setFeedback(view, `错题集共 ${Object.keys(shared.mistakes).length} 个音（当前调性可练 `
      + `${views.mistakes.pool().length} 个），点「开始错题练习」`, GRAY);
  }
}

function replay(view){
  if (!view.sessionActive){
    setFeedback(view, "还没有题目，先点上方「开始」按钮", GRAY);
    return;
  }
  playNote(expected(view).midi);
}

function prevQuestion(view){
  if (!view.sessionActive){
    setFeedback(view, "还没有题目，先点上方「开始」按钮", GRAY);
    return;
  }
  cancelAutoNext(view);
  if (view.qIndex === 0){
    setFeedback(view, "已经是第一题了", GRAY);
    return;
  }
  enterQuestion(view, view.qIndex - 1);
}

function nextQuestion(view){
  if (!view.sessionActive){
    setFeedback(view, "还没有题目，先点上方「开始」按钮", GRAY);
    return;
  }
  cancelAutoNext(view);
  if (view.results[view.qIndex] === null){ forfeit(view, "已跳过，正确答案"); return; }
  if (view.qIndex + 1 >= view.questions.length){ showSummary(view); return; }
  enterQuestion(view, view.qIndex + 1);
}

function answer(view, name){
  if (!view.sessionActive || view.results[view.qIndex] !== null){
    setFeedback(view, "这题已经作答过了，点「下一题」继续", GRAY);
    return;
  }
  if (pcOf(name) === expected(view).midi % 12){
    shared.correct++; shared.streak++;
    shared.bestStreak = Math.max(shared.bestStreak, shared.streak);
    let message = `正确！是 ${shownNote(view)}（唱名 ${solfege(expected(view).name)}）`;
    if (shared.streak >= 3) message += `　连对 ${shared.streak}`;
    const removal = gradeMistake(view, true);
    if (removal) message += `　${removal}`;
    view.results[view.qIndex] = {ok: true, clicked: name, message};
    applyResultColors(view, true, name);
    finish(view, true, message, GREEN);
    if (settings.autoNext.checked) view.autoTimer = setTimeout(() => nextQuestion(view), 900);
  } else {
    const message = `不是 ${display(name)}，正确答案是 ${shownNote(view)}`
      + `（唱名 ${solfege(expected(view).name)}）。点「重听」加深印象`;
    gradeMistake(view, false);
    view.results[view.qIndex] = {ok: false, clicked: name, message};
    applyResultColors(view, false, name);
    finish(view, false, message, RED);
    if (settings.autoNext.checked) view.autoTimer = setTimeout(() => nextQuestion(view), 1400);  // 答错也自动下一题
  }
}

function revealAnswer(view){
  if (!view.sessionActive || view.results[view.qIndex] !== null){
    setFeedback(view, "这题已经作答过了，点「下一题」继续", GRAY);
    return;
  }
  forfeit(view, "答案");
}

function forfeit(view, prefix){
  const message = `${prefix}是 ${shownNote(view)}（唱名 ${solfege(expected(view).name)}），下一题加油`;
  gradeMistake(view, false);
  view.results[view.qIndex] = {ok: false, clicked: null, message};
  applyResultColors(view, false, null);
  finish(view, false, message, GRAY);
  if (settings.autoNext.checked) view.autoTimer = setTimeout(() => nextQuestion(view), 1400);
}

function showSummary(view){
  view.sessionActive = false;
  cancelAutoNext(view);
  const total = view.questions.length;
  const right = view.questions.filter((q, i) => view.results[i].ok).map(q => q.name);
  const wrong = view.questions.filter((q, i) => !view.results[i].ok).map(q => q.name);
  const lines = [`练习完成！本轮 ${total} 题答对 ${right.length} 题（${Math.round(100 * right.length / total)}%）`];
  if (right.length) lines.push("答对：" + [...new Set(right)].map(display).join("、"));
  if (wrong.length){
    const parts = [...new Set(wrong)].map(n => {
      const c = wrong.filter(x => x === n).length;
      return c > 1 ? `${display(n)}×${c}` : display(n);
    });
    lines.push(`答错：${parts.join("、")}（去「错题练习」巩固）`);
  } else {
    lines.push("全部答对，太棒了！");
  }
  setFeedback(view, lines.join("\n"), DARK);
  setPlayButton(view, "再来一组", false, () => startSession(view));
  renderStats();
}

// ---- 记分与错题(两个页面共享) ----
function finish(view, ok, message, color){
  shared.attempts++;
  if (!ok) shared.streak = 0;
  shared.history.push([shownNote(view), ok]);
  if (shared.history.length > 12) shared.history = shared.history.slice(-12);
  setFeedback(view, message, color);
  renderStats();
  renderChips();
}

function gradeMistake(view, ok){
  // 作答后更新错题集(按音高合并, 等音写法共用一条):
  // 答错计入; 准确率只统计日常练习中的作答(错题练习不计入),
  // 该音进入错题集后的日常练习正确率达到 95% 时移出, 返回提示文案
  const pc = expected(view).midi % 12;
  const item = shared.mistakes[pc];
  if (!item){
    if (ok) return null;
    shared.mistakes[pc] = {
      name: expected(view).name, count: 1,
      tries: view === views.practice ? 1 : 0, hits: 0,
    };
    saveMistakes(); updateMistakeUI();
    return null;
  }
  if (!ok) item.count++;
  let removal = null;
  if (view === views.practice){  // 准确率只在日常练习中统计
    item.tries++;
    if (ok) item.hits++;
    const rate = item.hits / item.tries;
    if (rate >= 0.95){
      removal = `正确率 ${Math.round(rate * 100)}%，已移出错题集`;
      delete shared.mistakes[pc];
    }
  }
  saveMistakes(); updateMistakeUI();
  return removal;
}

function applyResultColors(view, ok, clicked){
  const right = noteButton(view, expected(view).name);
  if (right) right.classList.add("ok");
  if (!ok && clicked && clicked !== expected(view).name){
    const wrong = noteButton(view, clicked);
    if (wrong) wrong.classList.add("bad");
  }
}
function noteButton(view, name){
  for (const btn of view.el.notes.children) if (btn.dataset.name === name) return btn;
  return null;
}

// ---- 界面渲染 ----
// 反馈配色走 data-tone(CSS 变量, 自动适配深色模式), 不再用内联颜色
const FEEDBACK_TONE = {"#15803d": "good", "#b91c1c": "bad", "#6b7280": "idle", "#374151": "info"};
function setFeedback(view, text, color){
  view.el.feedback.textContent = text;
  view.el.feedback.dataset.tone = FEEDBACK_TONE[color] || "idle";
  if (view === active){
    view.el.feedback.animate([{opacity: 0.25}, {opacity: 1}], {duration: 180, easing: "ease-out"});
  }
}

function setPlayButton(view, label, replayMode, handler){
  view.el.play.classList.toggle("replay-mode", replayMode);  // 图标(播放/重听)由 CSS 切换
  view.el.play.querySelector(".label").textContent = label;
  view.el.play.onclick = handler;
}

function renderNoteButtons(view){
  view.el.notes.textContent = "";
  for (const name of SCALES[settings.scale.value]){
    const btn = document.createElement("button");
    btn.textContent = display(name);
    btn.dataset.name = name;
    btn.onclick = () => answer(view, name);
    view.el.notes.appendChild(btn);
  }
}

function updateMistakeUI(){
  const entries = Object.entries(shared.mistakes).sort((a, b) => a[0] - b[0]);
  const badge = $("mistakeBadge");
  badge.textContent = entries.length;
  badge.hidden = !entries.length;
  const chips = $("mistakeChips");
  chips.textContent = "";
  if (!entries.length){
    chips.textContent = "（空）";
  } else {
    // 不显示音名, 避免提前剧透; 圆点表示一个错音, ×n 为累计错次
    for (const [, item] of entries){
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = item.count > 1 ? `●×${item.count}` : "●";
      chips.appendChild(tag);
    }
  }
  if (!views.mistakes.sessionActive && views.mistakes === active) renderIdle(views.mistakes);
}

function renderStats(){
  const head = active.sessionActive
    ? `第 ${active.qIndex + 1}/${active.questions.length} 题 · ` : "";
  const acc = shared.attempts ? Math.round(100 * shared.correct / shared.attempts) : 0;
  $("stats").textContent = `${head}已答 ${shared.attempts} · 正确 ${shared.correct} · 准确率 ${acc}% `
    + `· 连对 ${shared.streak}（最佳 ${shared.bestStreak}）`;
}

function renderChips(){
  const chips = $("chips");
  chips.textContent = "";
  for (const [text, ok] of shared.history){
    const span = document.createElement("span");
    span.className = ok ? "ok" : "bad";
    span.textContent = text;  // 对勾/叉由 CSS ::after 画出
    chips.appendChild(span);
  }
}

// ---- 页面切换与设置 ----
function switchView(name){
  const view = views[name];
  if (view === active) return;
  cancelAutoNext(active);  // 暂停离开页面的自动下一题, 会话本身保留
  active = view;
  for (const tab of document.querySelectorAll(".tab")){
    tab.classList.toggle("active", tab.dataset.view === name);
  }
  views.practice.el.root.hidden = name !== "practice";
  views.mistakes.el.root.hidden = name !== "mistakes";
  renderCurrent(view);
  renderStats();
}

function invalidate(view){  // 作废进行中的一组
  cancelAutoNext(view);
  view.sessionActive = false;
  renderNoteButtons(view);
  if (view === active) renderIdle(view);
}

function onScaleOctaveChange(){  // 调性/八度切换作废两个页面进行中的一组
  invalidate(views.practice);
  invalidate(views.mistakes);
  setFeedback(active,
    `已切换：${settings.scale.value} · 八度 ${settings.octave.value}，重新开始一组吧`, GRAY);
}
settings.scale.onchange = onScaleOctaveChange;
settings.octave.onchange = onScaleOctaveChange;

// ---- 初始化 ----
for (const [box, values, initial] of [
  [settings.scale, Object.keys(SCALES), "C大调"],
  [settings.octave, OCTAVE_CHOICES, "4"],
  [settings.size, SESSION_CHOICES, "10"],
]){
  for (const v of values){
    const option = document.createElement("option");
    option.value = option.textContent = v;
    box.appendChild(option);
  }
  box.value = initial;
}

for (const tab of document.querySelectorAll(".tab")){
  tab.onclick = () => switchView(tab.dataset.view);
}
for (const view of Object.values(views)){
  view.el.prev.onclick = () => prevQuestion(view);
  view.el.next.onclick = () => nextQuestion(view);
  view.el.reveal.onclick = () => revealAnswer(view);
  setPlayButton(view, view === views.practice ? "开始练习" : "开始错题练习", false, () => startSession(view));
}

document.addEventListener("keydown", e => {
  if (e.code !== "Space") return;
  if (["BUTTON", "SELECT", "INPUT"].includes(e.target.tagName)) return;  // 交给控件默认行为
  e.preventDefault();
  active.sessionActive ? nextQuestion(active) : startSession(active);
});

updateMistakeUI();
renderNoteButtons(views.practice);
renderNoteButtons(views.mistakes);  // 选项与日常练习一致: 都是当前调性的音阶
renderStats();
preload();
</script>
</body>
</html>
